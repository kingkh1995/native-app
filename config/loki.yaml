# Loki 日志聚合配置（单节点测试用）
# 接收 OTel Collector 通过 OTLP HTTP 转发的日志数据

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /tmp/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # Loki 3.x 唯一支持的索引格式，单节点测试无感知
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        period: 24h

limits_config:
  allow_structured_metadata: true
