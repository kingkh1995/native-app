# Grafana Dashboard 供应配置
# 指定从 /var/lib/grafana/dashboards/ 目录自动加载所有 Dashboard JSON 文件

apiVersion: 1
providers:
  - name: default
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
