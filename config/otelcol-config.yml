receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
exporters:
  # 将数据输出到控制台
  debug:
    # basic normal detailed
    verbosity: basic
  # 两种方式数据转发到prometheus：
  # 直接使用otel格式（需要在prometheus端配置otlp）
  # 将otlp格式转换为prometheus格式供prometheus抓取
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      service: demo
    send_timestamps: true
    metric_expiration: 5m
    enable_open_metrics: true
    add_metric_suffixes: false
    resource_to_telemetry_conversion:
      enabled: true
  # tracing转发至Tempo的OTLP端点
  otlp/tempo:
    endpoint: tempo:5317
    tls:
      insecure: true
  # logging转发至loki
  otlphttp/logs:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
service:
  pipelines:
    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ prometheus, debug ]
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/tempo, debug ]
    logs:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlphttp/logs, debug ]


