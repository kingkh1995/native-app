# Tempo 分布式链路追踪后端配置
# 接收 OTel Collector 转发的链路追踪数据

# 启用 HTTP 流式查询，提升 Grafana 中 Trace 查询的响应速度
stream_over_http_enabled: true

server:
  # Tempo HTTP API 端口（查询接口、Grafana 数据源连接地址）
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          # OTLP gRPC 接收端点，OTel Collector 将追踪数据转发到此地址
          endpoint: 0.0.0.0:5317

storage:
  trace:
    backend: local
    # WAL（Write-Ahead Log）确保数据异常宕机时不丢失
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
