# Tempo 分布式链路追踪后端配置
# 接收 OTel Collector 转发的链路追踪数据

# 启用 HTTP 流式查询，提升 Grafana 中 Trace 查询的响应速度
stream_over_http_enabled: true

server:
  # Tempo HTTP API 端口（查询接口、Grafana 数据源连接地址）
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          # OTLP gRPC 接收端点，OTel Collector 将追踪数据转发到此地址
          endpoint: 0.0.0.0:5317

# 查询前端配置（启用搜索功能）
query_frontend:
  max_outstanding_per_tenant: 2000
  search:
    # 后端搜索结果可查的时间间隔
    query_backend_after: 1m

# 查询器配置
querier:
  max_concurrent_queries: 20

# Live store 配置（Tempo 3.x 新架构，替代旧的 ingester）
live_store:
  # 追踪在 flush 之前的最大空闲时间
  max_trace_idle: 5s
  # 单个 block 的最大持续时间（完成后的 block 才可搜索）
  max_block_duration: 10s
  # block 完成后在 live-store 中保留的时间
  complete_block_timeout: 30m

storage:
  trace:
    backend: local
    # WAL（Write-Ahead Log）确保数据异常宕机时不丢失
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
