// https://docs.spring.io/spring-boot/reference/actuator/observability.html
// 运行镜像已切换到 paketobuildpacks/ubuntu-noble-run:latest（包含 shell，可 docker exec 登录容器）。构建仍然使用 paketobuildpacks/builder-noble-java-tiny 作为构建器。
// 通过GraalVM Native Support，无需本地安装graalvm环境，直接在docker容器环境内构建native镜像。
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.11.5'
}
group = 'com.kk'
version = '0.0.1-SNAPSHOT'
description = 'Demo native project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    maven {
        url = 'https://repo.huaweicloud.com/repository/maven/'
    }
    mavenCentral()
}

dependencies {
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    compileOnly 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Spring Boot 4.0 可观测性 starter（包含 OTel SDK + tracing bridge + OTLP exporter）
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    runtimeOnly 'io.micrometer:micrometer-registry-otlp'
    // Logback OTel appender（将日志导出到 OTel Collector）
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.21.0-alpha'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apiguardian:apiguardian-api:1.1.2'
}

tasks.named('compileJava') {
    dependsOn('clean')
}

tasks.named('processAot') {
    args '--spring.profiles.active=dev'
}

tasks.named('bootRun') {
    args '--spring.profiles.active=dev'
}

tasks.named('test') {
    useJUnitPlatform()
}

// docker run --rm --user=root --network=native-app_default -p 8080:8080 -v demo-logs:/var/logs native-app/demo:0.0.1-SNAPSHOT
bootBuildImage {
    imageName = "native-app/${project.name}:${project.version}"
    verboseLogging = true
    cleanCache = false
    runImage = "paketobuildpacks/ubuntu-noble-run:latest"
    bindings = [
            "${projectDir}/bindings:/platform/bindings",
            "${projectDir}/ext-files:/ext-files"
    ]
    environment = [
            "BPL_DEBUG_ENABLED": "true",
            "BPL_DEBUG_PORT"   : "8000",
            "JAVA_TOOL_OPTIONS": "-Xmx256m -Xms256m"
    ]
}
