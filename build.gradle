// https://docs.spring.io/spring-boot/reference/actuator/observability.html
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    // 构建默认的基础镜像是 paketobuildpacks/builder-noble-java-tiny:latest。它占用空间小，攻击面小。它不包含 shell，并且只包含少量系统库。
    // 如需要支持更多工具，可以使用 paketobuildpacks/ubuntu-noble-run-base:latest。
    // 无需本地安装graalvm环境，通过docker启动容器，在容器环境内构建原生镜像。
    id 'org.graalvm.buildtools.native' version '0.11.5'
}
group = 'com.kk'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    maven {
        url 'https://repo.huaweicloud.com/repository/maven/'
    }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    // Spring Boot 4.0 可观测性 starter（包含 OTel SDK + tracing bridge + OTLP exporter）
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    runtimeOnly 'io.micrometer:micrometer-registry-otlp'
    // Logback OTel appender（将日志导出到 OTel Collector）
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.20.0-alpha'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    args '--spring.profiles.active=dev'
}

// docker run --rm --user=root --network=host -p 8080:8080 -v demo-logs:/var/logs local-dev/demo:0.0.1-SNAPSHOT
bootBuildImage {
    imageName = "local-dev/${project.name}:${project.version}"
    verboseLogging = true
    cleanCache = true
    pullPolicy = "IF_NOT_PRESENT"
    // 挂载卷到容器中，替换构建容器的配置文件，替换软件包下载地址。
    bindings = [
            "${projectDir}/bindings:/platform/bindings",
            "${projectDir}/ext-files:/ext-files"
    ]
    environment = [
            "BPL_DEBUG_ENABLED": "true",
            "BPL_DEBUG_PORT"   : "8000",
            "JAVA_TOOL_OPTIONS": "-Xmx256m -Xms256m"
    ]
}
